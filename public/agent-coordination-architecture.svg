<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Klide agent coordination architecture</title>
  <desc id="desc">Native Harness Runs, Delegate agents, and the operator reach one Rust-owned coordination core through identity-bound adapters. The core writes an append-only journal and projects snapshots used by Mission Control, agent tools, and MCP clients.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f7f7f4; }
    .surface { fill: #ffffff; stroke: #d8d9d4; }
    .soft { fill: #eef2e8; stroke: #b9c5aa; }
    .future { fill: #f2f2ef; stroke: #b9bcb5; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: #8c9188; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #6f8f46; stroke-width: 2; }
    .dot { fill: #6f8f46; }
    .text { fill: #20221f; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #686d65; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { font-size: 16px; font-weight: 500; }
    .small { font-size: 13px; }
    .tiny { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; }
    .title { font-size: 32px; font-weight: 500; }
    .subtitle { font-size: 16px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171815; }
      .surface { fill: #20221f; stroke: #3c4039; }
      .soft { fill: #262d20; stroke: #59684a; }
      .future { fill: #1c1e1b; stroke: #62665f; }
      .line { stroke: #72786f; }
      .accent-line { stroke: #8aaa5e; }
      .dot { fill: #8aaa5e; }
      .text { fill: #eceee9; }
      .muted { fill: #adb2a9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9188"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8f46"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="675"/>
  <text class="text title" x="72" y="72">One coordination core. Every Run.</text>
  <text class="muted subtitle" x="72" y="102">Stable identity and durable intent above Harness turns, Delegate processes, and UI lifecycles.</text>

  <text class="muted tiny" x="72" y="155">EXECUTION OWNERS</text>
  <rect class="surface" x="72" y="176" width="230" height="78" rx="8"/>
  <circle class="dot" cx="100" cy="204" r="4"/>
  <text class="text label" x="116" y="210">Native Harness Run</text>
  <text class="muted small" x="100" y="235">Provider turns · Tools · Transcript</text>

  <rect class="surface" x="72" y="278" width="230" height="78" rx="8"/>
  <circle class="dot" cx="100" cy="306" r="4"/>
  <text class="text label" x="116" y="312">Delegate Run</text>
  <text class="muted small" x="100" y="337">CLI adapter · PTY · status hook</text>

  <rect class="surface" x="72" y="380" width="230" height="78" rx="8"/>
  <circle class="dot" cx="100" cy="408" r="4"/>
  <text class="text label" x="116" y="414">Operator</text>
  <text class="muted small" x="100" y="439">Mission Control · explicit target</text>

  <path class="line" d="M302 215 H378" marker-end="url(#arrow)"/>
  <path class="line" d="M302 317 H378" marker-end="url(#arrow)"/>
  <path class="line" d="M302 419 H378" marker-end="url(#arrow)"/>
  <text class="muted tiny" x="328" y="194">BOUND</text>
  <text class="muted tiny" x="322" y="209">IDENTITY</text>

  <rect class="soft" x="378" y="152" width="420" height="342" rx="10"/>
  <text class="text" x="414" y="196" font-family="Atkinson Hyperlegible, sans-serif" font-size="23" font-weight="500">Klide Run Coordination</text>
  <text class="muted small" x="414" y="221">Rust-owned domain and authorization boundary</text>
  <line class="line" x1="414" y1="246" x2="762" y2="246"/>

  <circle class="dot" cx="421" cy="278" r="4"/>
  <text class="text label" x="440" y="284">Stable Run identity + lineage</text>
  <circle class="dot" cx="421" cy="322" r="4"/>
  <text class="text label" x="440" y="328">Normalized state + cancellation intent</text>
  <circle class="dot" cx="421" cy="366" r="4"/>
  <text class="text label" x="440" y="372">Addressed, idempotent envelopes</text>
  <circle class="dot" cx="421" cy="410" r="4"/>
  <text class="text label" x="440" y="416">Structured results + evidence</text>
  <circle class="dot" cx="421" cy="454" r="4"/>
  <text class="text label" x="440" y="460">Strict replay + snapshot cursor</text>

  <path class="accent-line" d="M588 494 V526" marker-end="url(#arrow-accent)"/>
  <rect class="surface" x="378" y="526" width="420" height="88" rx="8"/>
  <text class="text label" x="414" y="561">Append-only coordination journal</text>
  <text class="muted small" x="414" y="587">.klide/coordination/events.jsonl · shared across worktrees</text>

  <text class="muted tiny" x="860" y="155">CONTROL SURFACES</text>
  <path class="accent-line" d="M798 215 H864" marker-end="url(#arrow-accent)"/>
  <path class="accent-line" d="M798 317 H864" marker-end="url(#arrow-accent)"/>
  <path class="accent-line" d="M798 419 H864" marker-end="url(#arrow-accent)"/>

  <rect class="surface" x="864" y="176" width="264" height="78" rx="8"/>
  <text class="text label" x="896" y="209">Snapshot + event cursor</text>
  <text class="muted small" x="896" y="234">Mission Control and inspectors</text>

  <rect class="future" x="864" y="278" width="264" height="78" rx="8"/>
  <text class="text label" x="896" y="311">Native agent Tools</text>
  <text class="muted small" x="896" y="336">list · send · wait · cancel · result</text>

  <rect class="future" x="864" y="380" width="264" height="78" rx="8"/>
  <text class="text label" x="896" y="413">Embedded MCP + socket</text>
  <text class="muted small" x="896" y="438">Adapters into the same Rust core</text>

  <rect class="soft" x="864" y="526" width="264" height="88" rx="8"/>
  <text class="text label" x="896" y="561">Related durable evidence</text>
  <text class="muted small" x="896" y="586">Transcripts · Missions · Memory</text>
  <path class="line" d="M798 570 H864" marker-end="url(#arrow)"/>

  <text class="muted small" x="72" y="646">Solid surfaces ship in the foundation. Dashed surfaces bind live agents in the next slices; MCP never becomes the owner.</text>
</svg>
