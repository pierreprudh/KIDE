<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Klide Run and coordination envelope lifecycle</title>
  <desc id="desc">A coordinated Run progresses from queued through active states to a terminal result. An addressed envelope progresses from queued to safe-boundary delivery and acknowledgement, with each transition recorded in the journal.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f7f7f4; }
    .surface { fill: #ffffff; stroke: #d8d9d4; }
    .active { fill: #eef2e8; stroke: #b9c5aa; }
    .terminal { fill: #f1f2ee; stroke: #c5c8c0; }
    .line { fill: none; stroke: #8c9188; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #6f8f46; stroke-width: 2; }
    .return-line { fill: none; stroke: #9aa095; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .step { fill: #6f8f46; }
    .step-text { fill: #ffffff; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
    .text { fill: #20221f; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #686d65; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { font-size: 16px; font-weight: 500; text-anchor: middle; }
    .small { font-size: 13px; text-anchor: middle; }
    .tiny { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; }
    .title { font-size: 32px; font-weight: 500; }
    .subtitle { font-size: 16px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171815; }
      .surface { fill: #20221f; stroke: #3c4039; }
      .active { fill: #262d20; stroke: #59684a; }
      .terminal { fill: #242623; stroke: #50544d; }
      .line { stroke: #72786f; }
      .accent-line { stroke: #8aaa5e; }
      .return-line { stroke: #72786f; }
      .step { fill: #8aaa5e; }
      .step-text { fill: #171815; }
      .text { fill: #eceee9; }
      .muted { fill: #adb2a9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9188"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8f46"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="600"/>
  <text class="text title" x="72" y="68">State is explicit. Delivery is durable.</text>
  <text class="muted subtitle" x="72" y="98">Execution adapters report transitions; the coordination journal makes them replayable.</text>

  <text class="muted tiny" x="72" y="145">NORMALIZED RUN STATE</text>
  <path class="line" d="M220 213 H270" marker-end="url(#arrow)"/>
  <path class="accent-line" d="M420 213 H470" marker-end="url(#arrow-accent)"/>
  <path class="line" d="M620 213 H670" marker-end="url(#arrow)"/>
  <path class="accent-line" d="M820 213 H870" marker-end="url(#arrow-accent)"/>

  <rect class="surface" x="70" y="168" width="150" height="90" rx="8"/>
  <text class="text label" x="145" y="207">Queued</text>
  <text class="muted small" x="145" y="231">Identity reserved</text>

  <rect class="surface" x="270" y="168" width="150" height="90" rx="8"/>
  <text class="text label" x="345" y="207">Starting</text>
  <text class="muted small" x="345" y="231">Adapter boot</text>

  <rect class="active" x="470" y="168" width="150" height="90" rx="8"/>
  <text class="text label" x="545" y="207">Working</text>
  <text class="muted small" x="545" y="231">Turns and Tools</text>

  <rect class="surface" x="670" y="168" width="150" height="90" rx="8"/>
  <text class="text label" x="745" y="198">Blocked · Waiting</text>
  <text class="muted small" x="745" y="222">Input or dependency</text>
  <text class="muted small" x="745" y="240">Reviewing is a gate</text>

  <rect class="terminal" x="870" y="168" width="260" height="90" rx="8"/>
  <text class="text label" x="1000" y="201">Done · Failed · Cancelled</text>
  <text class="muted small" x="1000" y="225">Terminal — cannot reopen</text>
  <text class="muted small" x="1000" y="243">Publish structured result</text>

  <path class="return-line" d="M745 258 V282 H545 V258" marker-end="url(#arrow)"/>
  <text class="muted small" x="645" y="298">resume when the boundary resolves</text>

  <line class="line" x1="72" y1="328" x2="1128" y2="328"/>
  <text class="muted tiny" x="72" y="370">COORDINATION ENVELOPE</text>

  <path class="line" d="M280 447 H382" marker-end="url(#arrow)"/>
  <path class="accent-line" d="M632 447 H734" marker-end="url(#arrow-accent)"/>
  <path class="accent-line" d="M984 447 H1080" marker-end="url(#arrow-accent)"/>

  <rect class="surface" x="72" y="398" width="208" height="98" rx="8"/>
  <circle class="step" cx="103" cy="428" r="14"/>
  <text class="step-text" x="103" y="433">1</text>
  <text class="text label" x="176" y="442">Queued</text>
  <text class="muted small" x="176" y="468">Durable addressed intent</text>

  <rect class="active" x="382" y="398" width="250" height="98" rx="8"/>
  <circle class="step" cx="413" cy="428" r="14"/>
  <text class="step-text" x="413" y="433">2</text>
  <text class="text label" x="507" y="438">Safe boundary</text>
  <text class="muted small" x="507" y="462">Between Harness turns</text>
  <text class="muted small" x="507" y="480">or Delegate idle / blocked</text>

  <rect class="active" x="734" y="398" width="250" height="98" rx="8"/>
  <circle class="step" cx="765" cy="428" r="14"/>
  <text class="step-text" x="765" y="433">3</text>
  <text class="text label" x="859" y="442">Delivered</text>
  <text class="muted small" x="859" y="468">Pinned to recipient Run id</text>

  <rect class="terminal" x="1080" y="398" width="50" height="98" rx="8"/>
  <circle class="step" cx="1105" cy="428" r="14"/>
  <text class="step-text" x="1105" y="433">4</text>
  <text class="text" x="1105" y="470" font-family="Atkinson Hyperlegible, sans-serif" font-size="13" font-weight="500" text-anchor="middle" transform="rotate(-90 1105 470)">ACK</text>

  <text class="muted small" x="600" y="548">Every arrow is an event. Idempotency makes retries safe; acknowledgement never changes the target.</text>
</svg>
