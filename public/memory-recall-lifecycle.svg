<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Klide Project Memory lifecycle</title>
  <desc id="desc">A Run creates Transcript evidence, a model derives a draft, the user reviews it, accepted knowledge enters Project Memory, and future Runs recall it with provenance.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f7f7f4; }
    .surface { fill: #ffffff; stroke: #d8d9d4; }
    .active { fill: #eef2e8; stroke: #b9c5aa; }
    .line { fill: none; stroke: #8c9188; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #6f8f46; stroke-width: 2; }
    .step { fill: #6f8f46; }
    .step-text { fill: #ffffff; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
    .text { fill: #20221f; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #686d65; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { font-size: 16px; font-weight: 500; text-anchor: middle; }
    .small { font-size: 13px; text-anchor: middle; }
    .title { font-size: 32px; font-weight: 500; }
    .subtitle { font-size: 16px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171815; }
      .surface { fill: #20221f; stroke: #3c4039; }
      .active { fill: #262d20; stroke: #59684a; }
      .line { stroke: #72786f; }
      .accent-line { stroke: #8aaa5e; }
      .step { fill: #8aaa5e; }
      .step-text { fill: #171815; }
      .text { fill: #eceee9; }
      .muted { fill: #adb2a9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9188"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8f46"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="600"/>
  <text class="text title" x="72" y="72">Learning stays reviewable.</text>
  <text class="muted subtitle" x="72" y="102">Evidence becomes durable knowledge only after a human decision.</text>

  <path class="line" d="M226 246 H300" marker-end="url(#arrow)"/>
  <path class="line" d="M450 246 H524" marker-end="url(#arrow)"/>
  <path class="accent-line" d="M674 246 H748" marker-end="url(#arrow-accent)"/>
  <path class="accent-line" d="M898 246 H972" marker-end="url(#arrow-accent)"/>

  <rect class="surface" x="76" y="176" width="150" height="140" rx="8"/>
  <circle class="step" cx="106" cy="206" r="14"/>
  <text class="step-text" x="106" y="211">1</text>
  <text class="text label" x="151" y="247">Run</text>
  <text class="muted small" x="151" y="274">Agent works</text>

  <rect class="surface" x="300" y="176" width="150" height="140" rx="8"/>
  <circle class="step" cx="330" cy="206" r="14"/>
  <text class="step-text" x="330" y="211">2</text>
  <text class="text label" x="375" y="247">Evidence</text>
  <text class="muted small" x="375" y="274">Transcript + files</text>

  <rect class="surface" x="524" y="176" width="150" height="140" rx="8"/>
  <circle class="step" cx="554" cy="206" r="14"/>
  <text class="step-text" x="554" y="211">3</text>
  <text class="text label" x="599" y="247">Draft</text>
  <text class="muted small" x="599" y="274">Proposed learning</text>

  <rect class="active" x="748" y="176" width="150" height="140" rx="8"/>
  <circle class="step" cx="778" cy="206" r="14"/>
  <text class="step-text" x="778" y="211">4</text>
  <text class="text label" x="823" y="247">Review</text>
  <text class="muted small" x="823" y="274">Accept · edit · reject</text>

  <rect class="active" x="972" y="176" width="150" height="140" rx="8"/>
  <circle class="step" cx="1002" cy="206" r="14"/>
  <text class="step-text" x="1002" y="211">5</text>
  <text class="text label" x="1047" y="247">Memory</text>
  <text class="muted small" x="1047" y="274">Reviewed + sourced</text>

  <path class="accent-line" d="M1047 316 V406 H151 V316" marker-end="url(#arrow-accent)"/>
  <rect class="active" x="434" y="382" width="332" height="104" rx="8"/>
  <circle class="step" cx="470" cy="416" r="14"/>
  <text class="step-text" x="470" y="421">6</text>
  <text class="text" x="500" y="422" font-family="Atkinson Hyperlegible, sans-serif" font-size="17" font-weight="500">Recall with provenance</text>
  <text class="muted" x="500" y="450" font-family="Atkinson Hyperlegible, sans-serif" font-size="13">Future Runs see the source and match reason.</text>

  <text class="muted small" x="600" y="540">Rejected drafts disappear. Stale and superseded memories remain inspectable but stay out of normal recall.</text>
</svg>
