<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Klide Memory Engine architecture</title>
  <desc id="desc">Runs and Transcripts feed one local Memory Engine. Reviewed Markdown and a derived local index support native Kit and Mission recall, while an embedded MCP server gives Delegate agents access to the same engine.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #f7f7f4; }
    .surface { fill: #ffffff; stroke: #d8d9d4; }
    .soft { fill: #eef2e8; stroke: #b9c5aa; }
    .line { fill: none; stroke: #8c9188; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #6f8f46; stroke-width: 2; }
    .dot { fill: #6f8f46; }
    .text { fill: #20221f; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #686d65; font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { font-size: 16px; font-weight: 500; letter-spacing: .2px; }
    .small { font-size: 13px; }
    .title { font-size: 32px; font-weight: 500; }
    .subtitle { font-size: 16px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171815; }
      .surface { fill: #20221f; stroke: #3c4039; }
      .soft { fill: #262d20; stroke: #59684a; }
      .line { stroke: #72786f; }
      .accent-line { stroke: #8aaa5e; }
      .dot { fill: #8aaa5e; }
      .text { fill: #eceee9; }
      .muted { fill: #adb2a9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9188"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8f46"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="675"/>
  <text class="text title" x="72" y="74">One memory engine. Every agent.</text>
  <text class="muted subtitle" x="72" y="104">Local knowledge, reviewed by the user, shared through Klide-owned interfaces.</text>

  <rect class="surface" x="72" y="190" width="210" height="92" rx="8"/>
  <circle class="dot" cx="100" cy="218" r="4"/>
  <text class="text label" x="116" y="224">Runs</text>
  <text class="muted small" x="100" y="252">Kit · Missions · Delegates</text>

  <rect class="surface" x="72" y="322" width="210" height="92" rx="8"/>
  <circle class="dot" cx="100" cy="350" r="4"/>
  <text class="text label" x="116" y="356">Transcripts</text>
  <text class="muted small" x="100" y="384">Append-only evidence</text>

  <path class="line" d="M177 282 V322" marker-end="url(#arrow)"/>
  <path class="accent-line" d="M282 368 H390" marker-end="url(#arrow-accent)"/>

  <rect class="soft" x="390" y="158" width="350" height="310" rx="10"/>
  <text class="text" x="426" y="204" font-family="Atkinson Hyperlegible, sans-serif" font-size="23" font-weight="500">Klide Memory Engine</text>
  <text class="muted small" x="426" y="229">Rust-owned domain and trust boundary</text>

  <line class="line" x1="426" y1="254" x2="704" y2="254"/>
  <circle class="dot" cx="433" cy="285" r="4"/>
  <text class="text label" x="452" y="291">Capture</text>
  <text class="muted small" x="452" y="312">Run evidence becomes a draft</text>

  <circle class="dot" cx="433" cy="347" r="4"/>
  <text class="text label" x="452" y="353">Review</text>
  <text class="muted small" x="452" y="374">Accept · edit · merge · reject</text>

  <circle class="dot" cx="433" cy="409" r="4"/>
  <text class="text label" x="452" y="415">Recall</text>
  <text class="muted small" x="452" y="436">Ranked results with provenance</text>

  <rect class="surface" x="390" y="510" width="350" height="92" rx="8"/>
  <text class="text label" x="426" y="544">Local source of truth</text>
  <text class="muted small" x="426" y="570">Reviewed Markdown · rebuildable index</text>
  <path class="accent-line" d="M565 468 V510" marker-end="url(#arrow-accent)"/>

  <path class="accent-line" d="M740 250 H846" marker-end="url(#arrow-accent)"/>
  <path class="accent-line" d="M740 338 H846" marker-end="url(#arrow-accent)"/>
  <path class="accent-line" d="M740 426 H846" marker-end="url(#arrow-accent)"/>

  <rect class="surface" x="846" y="204" width="282" height="92" rx="8"/>
  <text class="text label" x="878" y="239">Native Harness</text>
  <text class="muted small" x="878" y="265">Kit and Missions call Rust directly</text>

  <rect class="surface" x="846" y="322" width="282" height="92" rx="8"/>
  <text class="text label" x="878" y="357">Memory review</text>
  <text class="muted small" x="878" y="383">Sources and drafts stay visible</text>

  <rect class="surface" x="846" y="440" width="282" height="92" rx="8"/>
  <text class="text label" x="878" y="475">Embedded MCP server</text>
  <text class="muted small" x="878" y="501">Codex · Claude Code · Cursor</text>

  <text class="muted small" x="846" y="576">MCP is an adapter—not storage, ranking, or authority.</text>
</svg>
